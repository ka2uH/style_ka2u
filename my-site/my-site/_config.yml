# ===== Site settings / サイト設定 =====
# TODO: 自分の情報に書き換える / Replace with your own info
title: "My Learning Log / 学習ログ"
description: "Learning log and activity records. Open to invitations! / 学習ログと活動記録。お誘い歓迎です。"
lang: ja

# ユーザー名.github.io のリポジトリなら、url と baseurl はこのままでOK
# For a user site (USERNAME.github.io), leave baseurl empty.
url: "https://ka2uH.github.io"
baseurl: "/style_ka2u"

# GitHubのユーザー名（フッターのリンクに表示）/ GitHub username (shown in footer)
github_username: ka2uH

# ===== Theme / テーマ =====
theme: minima

# ヘッダーに表示するページ（この順に並ぶ）/ Pages shown in the header nav (in order)
header_pages:
  - about.md
  - log.md
  - contact.md

# ===== Build settings =====
markdown: kramdown
permalink: /log/:year/:month/:day/:title/
show_excerpts: true

exclude:
  - SETUP.md
  - README.md
